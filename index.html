<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Impostor: el celular es la carta secreta. Salas en vivo para jugar cara a cara." />
    <link rel="icon" href="/assets/impostor-logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/assets/impostor-mark.png" />
    <title>Impostor</title>
    <script>
      try {
        if (localStorage.getItem('impostor.theme') === 'dark') {
          document.documentElement.classList.add('dark')
          document.documentElement.dataset.theme = 'dark'
        }
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="landing-body text-ink min-h-dvh">
    <header class="nav-bar">
      <a href="/" class="brand-lockup no-underline text-white">
        <img src="/assets/impostor-logo.svg" width="36" height="36" alt="" class="brand-mark" />
        <span class="font-semibold tracking-tight">Impostor</span>
      </a>
      <div class="flex items-center gap-3">
        <button type="button" class="btn-theme" data-theme-toggle aria-pressed="false" title="Modo oscuro"></button>
      </div>
    </header>

    <main class="landing-main mx-auto max-w-[1200px] px-5">
      <section class="landing-hero">
        <div class="landing-hero-copy">
          <img
            src="/assets/impostor-mark.png"
            width="112"
            height="112"
            alt="Logo Impostor"
            class="landing-logo"
            decoding="async"
          />
          <p class="caption mb-3 uppercase tracking-[0.08em]">Celular = carta secreta</p>
          <h1 class="hero-title mb-4">Impostor</h1>
          <p class="body-text text-ink-muted-80 max-w-md mx-auto">
            Creá una sala, elegí la temática e invitá a los pibes. Hablar, acusar y votar es cara a
            cara.
          </p>
        </div>

        <form id="home-form" class="card-surface landing-form text-left space-y-4" method="post" action="#">
          <div id="auth-bar" class="rounded-[18px] bg-canvas-parchment px-4 py-3 space-y-3">
            <p id="auth-label" class="caption !text-ink-muted-80">Cargando sesión…</p>
            <div class="flex flex-wrap gap-2">
              <button id="google-btn" type="button" class="btn-secondary !py-2 !text-[14px]">
                Entrar con Google
              </button>
              <button id="logout-btn" type="button" class="btn-dark hidden !rounded-full">
                Cerrar sesión
              </button>
            </div>
          </div>

          <label class="block">
            <span class="caption mb-2 block">Tu apodo</span>
            <input
              id="nickname"
              name="nickname"
              class="input-pill"
              maxlength="20"
              autocomplete="nickname"
              placeholder="Ej: El Colo"
              required
            />
          </label>

          <fieldset class="space-y-2">
            <legend class="caption mb-1">Temática de la sala</legend>
            <div id="theme-picker" class="theme-grid" role="radiogroup" aria-label="Temática"></div>
            <input type="hidden" id="room-theme" name="theme" value="rosario" />
          </fieldset>

          <div class="grid gap-3">
            <button
              id="create-btn"
              type="submit"
              name="action"
              value="create"
              class="btn-primary w-full"
            >
              Crear sala
            </button>
            <p id="create-hint" class="caption hidden"></p>
            <div class="flex items-center gap-3">
              <div class="h-px flex-1 bg-hairline"></div>
              <span class="caption">o unirte</span>
              <div class="h-px flex-1 bg-hairline"></div>
            </div>
            <label class="block">
              <span class="caption mb-2 block">Código de sala</span>
              <input
                id="room-code"
                name="code"
                class="input-pill uppercase tracking-[0.2em] text-center"
                maxlength="6"
                placeholder="ABC123"
                autocomplete="off"
              />
            </label>
            <button type="submit" name="action" value="join" class="btn-secondary w-full">
              Unirme a la sala
            </button>
          </div>

          <div
            id="home-error"
            class="hidden rounded-[18px] bg-canvas-parchment px-4 py-3 body-text text-ink"
            role="alert"
          ></div>
          <div id="home-loading" class="hidden space-y-2" aria-live="polite">
            <div class="skeleton h-11 w-full"></div>
            <p class="caption text-center">Conectando…</p>
          </div>
        </form>
      </section>
    </main>

    <script type="module" src="/js/modules/home.js"></script>
  </body>
</html>
